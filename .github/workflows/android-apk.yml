name: Build Safwa Android APK

on:
workflow_dispatch:
push:
paths:
- '.github/workflows/android-apk.yml'

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Download project
uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Build APK
    run: |
      chmod +x gradlew
      ./gradlew assembleDebug